<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ejemplo</title>
</head>
<body>
    <header>
        <h1>Formulario de Ejemplo</h1>
    </header>

    <div>
        <h2>Formulario</h2>
        <p>
            Formulario de <strong>ejemplo</strong> que usa los <em>diferentes</em> 
            tipos de controles de entrada en HTML.
        </p>
    </div>
        <h2>Datos Personales</h2>
        
        <div>
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
        </div>

        <div>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="usuario@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Contraseña segura" required>
        </div>

        <div>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+34 123 456 789" required>
        </div>

        <div>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="18" max="100" placeholder="18" required>
        </div>

        <div>
            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>

        <div>
            <label for="color_favorito">Color Favorito:</label>
            <input type="color" id="color_favorito" name="color_favorito" value="#4CAF50">
        </div>

        <div>
            <label for="url">Sitio Web Personal:</label>
            <input type="url" id="url" name="url" placeholder="https://www.ejemplo.com">
        </div>

        <div>
            <label for="comentarios">Comentarios Adicionales:</label>
            <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe tus comentarios aquí..."></textarea>
        </div>

        <div>
            <input type="submit" value="Enviar Registro">
        </div>
</body>
</html>
